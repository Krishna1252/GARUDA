{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">DATA MANAGEMENT</p><h1>Customers</h1></div></div>
<section class="form-card"><h2>Add Customer</h2><form method="post"><input name="name" placeholder="Customer name" required><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><button class="btn">Save Customer</button></form></section>
<section class="panel"><h2>Customer Records</h2><table><tr><th>ID</th><th>Name</th><th>Phone</th><th>Email</th><th>Action</th></tr>{% for c in customers %}<tr><td>#{{c.id}}</td><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.email}}</td><td><form method="post" action="{{ url_for('delete_customer', customer_id=c.id) }}" onsubmit="return confirm('Delete this customer and all related vehicle/service records?');"><button class="delete-btn" type="submit">Delete</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
