{% extends "base.html" %}{% block content %}<div class="page-head"><div><p class="eyebrow">VEHICLE RECORDS</p><h1>Vehicles</h1></div></div>
<section class="form-card"><h2>Add Vehicle</h2><form method="post"><select name="customer_id" required><option value="">Select customer</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><input name="number" placeholder="Vehicle number" required><input name="model" placeholder="Model"><input name="year" type="number" placeholder="Year"><button class="btn">Save Vehicle</button></form></section>
<section class="panel"><h2>Vehicle Records</h2><table><tr><th>Number</th><th>Customer</th><th>Model</th><th>Year</th><th>Action</th></tr>{% for v in vehicles %}<tr><td>{{v.number}}</td><td>{{v.customer}}</td><td>{{v.model}}</td><td>{{v.year or "-"}}</td><td><form method="post" action="{{ url_for('delete_vehicle', vehicle_id=v.id) }}" onsubmit="return confirm('Delete this vehicle and its service history?');"><button class="delete-btn" type="submit">Delete</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
